<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tarota Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600&family=Onest:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4ECE0;--paper2:#EADFCF;--card:#FFFAF2;--ink:#1F1B33;--terra:#C2552F;--terra2:#E6A07A;--sage:#6E8B74;--muted:#7A6F66;--line:#DCCFBD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#d9cdbb;color:var(--ink);font:15px/1.5 Onest,system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
.phone{width:100%;max-width:400px;height:100vh;max-height:860px;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:500px){body{align-items:center}.phone{border:10px solid #1F1B33;border-radius:40px;height:820px;box-shadow:0 30px 80px #0004}}
main{flex:1;overflow-y:auto;padding:22px 20px 110px}
main.ob{padding-bottom:22px;display:flex;flex-direction:column}
h1,h2,.disp{font-family:'Montserrat Alternates',sans-serif;font-weight:600;letter-spacing:-.5px;margin:0}
h1{font-size:26px;line-height:1.15;margin-bottom:10px}
h2{font-size:17px;margin:26px 0 12px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.center{text-align:center}
/* nav: floating pill */
nav{position:absolute;left:14px;right:14px;bottom:14px;height:64px;background:#1F1B33;border-radius:32px;display:flex;align-items:center;justify-content:space-around;padding:0 6px}
nav button{background:none;border:0;color:#cfc6e8;width:56px;height:52px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font:600 10px Onest}
nav button.on{background:var(--terra);color:#fff}
nav svg{width:22px;height:22px}
/* arch cards */
.card{aspect-ratio:.6;border-radius:999px 999px 14px 14px/ 60% 60% 14px 14px;position:relative;cursor:pointer;user-select:none;overflow:hidden;flex:none}
.card.down{background:var(--terra);box-shadow:inset 0 0 0 5px var(--terra),inset 0 0 0 6.5px #f4ece099}
.card.down svg{position:absolute;inset:0;width:100%;height:100%}
.card.up{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.card .in{position:absolute;inset:0}
.card.rev .in{transform:rotate(180deg)}
.card .in svg{position:absolute;left:18%;top:24%;width:64%;height:44%}
.card .lbl{position:absolute;top:11%;left:0;right:0;text-align:center;font:600 11px 'Montserrat Alternates';color:var(--terra)}
.card .nm{position:absolute;bottom:7%;left:6%;right:6%;text-align:center;font-size:10.5px;font-weight:700;line-height:1.2}
.card.up.img{border-radius:10px;box-shadow:0 2px 0 var(--line),inset 0 0 0 1px var(--ink);background:var(--card)}
.card.up.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:10px}
.card.rev img{transform:rotate(180deg)}
.cname{font:600 18px 'Montserrat Alternates';letter-spacing:-.3px}
.pos{color:var(--terra);font:700 11px Onest;letter-spacing:1.2px;text-transform:uppercase}
.row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.btn{width:100%;height:54px;border-radius:27px;border:0;background:var(--ink);color:var(--paper);font:700 16px Onest;cursor:pointer}
.btn:disabled{opacity:.35}
.btn.t{background:var(--terra);color:#fff}
.obtn{width:100%;height:48px;border-radius:24px;border:1.5px solid var(--ink);background:none;color:var(--ink);font:700 15px Onest;cursor:pointer}
.link{background:none;border:0;color:var(--terra);font:700 15px Onest;padding:8px 0;cursor:pointer;text-decoration:none;display:inline-block}
input.f,textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:16px;color:var(--ink);padding:16px;font:600 17px Onest;outline:none}
input.f:focus,textarea:focus{border-color:var(--ink)}
textarea{font-size:15px;font-weight:400;resize:none}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1.5px solid var(--ink);border-radius:22px;padding:11px 16px;background:none;color:var(--ink);font:600 15px Onest;cursor:pointer}
.chip.on{background:var(--ink);color:var(--paper)}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;font:600 16px Onest;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.prog{display:flex;gap:5px;margin-bottom:28px}.prog i{flex:1;height:4px;border-radius:2px;background:var(--line)}.prog i.on{background:var(--terra)}
.grow{flex:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border-radius:20px;padding:16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;border:0;text-align:left;font:inherit;color:#1F1B33}
.tile b{font:600 14px 'Montserrat Alternates';letter-spacing:-.3px}
.tile .ic{width:30px;height:30px}
.c1{background:#F2C9B4}.c2{background:#CFDCCB}.c3{background:#E3D6F0}.c4{background:#F3E1A8}.c5{background:#1F1B33;color:#F4ECE0}
.ask{background:var(--ink);color:var(--paper);border-radius:24px;padding:20px}
.ask textarea{background:#2C2745;border-color:#2C2745;color:var(--paper);margin:12px 0}
.ask textarea::placeholder{color:#a69fc4}
.daily{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:24px;padding:16px;cursor:pointer;border:1.5px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--paper2);border-radius:14px;padding:6px 12px;font:700 12px Onest}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}
.answer{font:600 46px 'Montserrat Alternates';color:var(--terra);text-align:center;margin:6px 0}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.plan{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);background:var(--card);border-radius:18px;padding:16px;margin-bottom:10px;cursor:pointer}
.plan.on{border-color:var(--terra);box-shadow:inset 0 0 0 1px var(--terra)}
.plan .tag{background:var(--terra);color:#fff;font:700 11px Onest;border-radius:10px;padding:4px 8px}
.ben{display:flex;gap:10px;align-items:center;margin:9px 0;font-weight:600}
.ben i{width:22px;height:22px;border-radius:11px;background:var(--sage);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}
.x{position:absolute;top:16px;right:18px;background:none;border:0;font-size:26px;color:var(--muted);cursor:pointer}
.check{display:flex;align-items:center;gap:12px;margin:14px 0;font-weight:600;opacity:.25;transition:.4s}.check.on{opacity:1}
.check i{width:24px;height:24px;border-radius:12px;background:var(--terra);color:#fff;display:flex;align-items:center;justify-content:center;font-style:normal}
label.r{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;font-weight:600}
input[type=radio],input[type=checkbox]{accent-color:var(--terra);width:20px;height:20px}
.hero-arch{width:220px;height:300px;margin:10px auto 26px;border-radius:110px 110px 18px 18px;background:var(--terra);position:relative;overflow:hidden}
.hero-arch svg{position:absolute;inset:0;width:100%;height:100%}
html[data-th=dark]{--paper:#15121F;--paper2:#26213A;--card:#1E1A2E;--ink:#F1EADF;--muted:#A59CB8;--line:#332D48;--terra:#D9683F}
html[data-th=dark] body{background:#0b0912}
html[data-th=dark] nav{background:#2A2440}
html[data-th=dark] .chip{border-color:var(--ink)}
.card.up{color:var(--ink)}
.wheels{position:relative;display:flex;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:0 10px;height:220px;overflow:hidden}
.wheels:before{content:"";position:absolute;left:10px;right:10px;top:88px;height:44px;background:var(--paper2);border-radius:12px}
.wheel{position:relative;flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding:88px 0;-webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:16px;color:var(--muted);cursor:pointer;white-space:nowrap}
.wheel div.sel{color:var(--ink);font:600 18px 'Montserrat Alternates',sans-serif}
.lesson p{font-size:16px;line-height:1.6;margin:14px 0 0;white-space:pre-line}
.qopt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:14px 16px;margin-bottom:10px;font:400 15px Onest;color:var(--ink);cursor:pointer}
.qopt.ok{border-color:var(--sage);background:#6E8B7433}.qopt.bad{border-color:var(--terra);background:#C2552F22}
.note{position:fixed;bottom:8px;left:10px;font-size:11px;color:#6d6252}
@media(max-width:499px){.note{display:none}}
</style></head><body>

const LESSONS=[{"ic": "cards", "t": ["Что такое Таро", "Таро деген не", "What tarot is", "Qué es el tarot"], "b": ["Таро — колода из 78 карт. Сегодня её чаще всего используют не для «точных предсказаний», а как зеркало: символы на картах помогают посмотреть на ситуацию со стороны и задать себе правильные вопросы.\n\nКолода делится на две части: 22 Старших аркана и 56 Младших. Старшие говорят о больших темах и поворотах жизни, Младшие — о повседневных делах, чувствах и решениях.\n\nВ Tarota используется классическая система Райдера-Уэйта (1909) — на ней построено большинство современных колод и книг.\n\nГлавное правило: карта не приговор. Она показывает тенденцию и подсказку, а решения всегда принимаешь ты.", "Таро — 78 картадан тұратын колода. Бүгінде оны «нақты болжам» үшін емес, айна ретінде жиі қолданады: карталардағы символдар жағдайға сырттай қарауға және өзіңе дұрыс сұрақ қоюға көмектеседі.\n\nКолода екі бөлікке бөлінеді: 22 Үлкен аркан және 56 Кіші аркан. Үлкендері өмірдің үлкен тақырыптары мен бетбұрыстары туралы, Кішілері — күнделікті істер, сезімдер мен шешімдер туралы.\n\nTarota-да Райдер-Уэйттің (1909) классикалық жүйесі қолданылады — заманауи колодалар мен кітаптардың көбі соған негізделген.\n\nБасты ереже: карта үкім емес. Ол үрдіс пен кеңесті көрсетеді, ал шешімді әрқашан өзің қабылдайсың.", "Tarot is a deck of 78 cards. Today most people use it not for \"exact predictions\" but as a mirror: the symbols help you see a situation from the outside and ask yourself better questions.\n\nThe deck has two parts: 22 Major Arcana and 56 Minor Arcana. The Majors speak about big themes and turning points; the Minors about everyday matters, feelings and decisions.\n\nTarota uses the classic Rider–Waite system (1909), the basis of most modern decks and books.\n\nThe golden rule: a card is not a verdict. It shows a tendency and a hint — the decisions are always yours.", "El tarot es una baraja de 78 cartas. Hoy la mayoría lo usa no para «predicciones exactas», sino como un espejo: los símbolos ayudan a ver una situación desde fuera y a hacerte mejores preguntas.\n\nLa baraja tiene dos partes: 22 Arcanos Mayores y 56 Arcanos Menores. Los Mayores hablan de grandes temas y giros de la vida; los Menores, de asuntos cotidianos, sentimientos y decisiones.\n\nTarota usa el sistema clásico Rider–Waite (1909), la base de la mayoría de barajas y libros modernos.\n\nLa regla de oro: una carta no es una sentencia. Muestra una tendencia y una pista; las decisiones siempre son tuyas."]}, {"ic": "moon", "t": ["Старшие арканы: путь Шута", "Үлкен аркандар: Сайқымазақтың жолы", "Major Arcana: the Fool's journey", "Arcanos Mayores: el viaje del Loco"], "b": ["22 Старших аркана удобно читать как историю. Шут (0) — это ты в начале пути: открытый, наивный, готовый к новому.\n\nДальше он встречает учителей: Мага (воля), Жрицу (интуиция), Императрицу (забота), Императора (порядок), Иерофанта (традиции). Потом приходят выбор (Влюблённые), движение (Колесница) и внутренняя сила (Сила).\n\nВторая половина пути — испытания и перемены: Отшельник, Колесо Фортуны, Повешенный, Смерть, Башня. Они не «плохие» — они очищают место для нового.\n\nПуть завершается светом: Звезда (надежда), Луна (сомнения), Солнце (радость), Суд (пробуждение) и Мир (целостность). Если в раскладе много Старших арканов — ситуация важная и надолго.", "22 Үлкен арканды бір оқиға ретінде оқу ыңғайлы. Сайқымазақ (0) — жолдың басындағы сенсің: ашық, аңғал, жаңалыққа дайын.\n\nОдан әрі ол ұстаздарды кездестіреді: Сиқыршы (ерік), Абыз әйел (түйсік), Императрица (қамқорлық), Император (тәртіп), Иерофант (дәстүр). Кейін таңдау (Ғашықтар), қозғалыс (Арба) және ішкі күш (Күш) келеді.\n\nЖолдың екінші жартысы — сынақтар мен өзгерістер: Дәруіш, Тағдыр дөңгелегі, Асылған адам, Өлім, Мұнара. Олар «жаман» емес — жаңаға орын босатады.\n\nЖол жарықпен аяқталады: Жұлдыз (үміт), Ай (күмән), Күн (қуаныш), Сот (ояну) және Әлем (тұтастық). Болжауда Үлкен аркандар көп болса — жағдай маңызды әрі ұзақ.", "The 22 Major Arcana read best as a story. The Fool (0) is you at the start: open, naive, ready for something new.\n\nAlong the way he meets teachers: the Magician (will), the High Priestess (intuition), the Empress (care), the Emperor (order), the Hierophant (tradition). Then come choice (the Lovers), movement (the Chariot) and inner strength (Strength).\n\nThe second half is trials and change: the Hermit, the Wheel, the Hanged Man, Death, the Tower. They aren't \"bad\" — they clear space for something new.\n\nThe journey ends in light: the Star (hope), the Moon (doubt), the Sun (joy), Judgement (awakening) and the World (wholeness). Many Majors in a reading mean the situation is important and long-term.", "Los 22 Arcanos Mayores se leen mejor como una historia. El Loco (0) eres tú al principio: abierto, ingenuo, listo para algo nuevo.\n\nEn el camino encuentra maestros: el Mago (voluntad), la Sacerdotisa (intuición), la Emperatriz (cuidado), el Emperador (orden), el Hierofante (tradición). Luego llegan la elección (los Enamorados), el movimiento (el Carro) y la fuerza interior (la Fuerza).\n\nLa segunda mitad son pruebas y cambios: el Ermitaño, la Rueda, el Colgado, la Muerte, la Torre. No son «malas»: dejan espacio para lo nuevo.\n\nEl viaje termina en la luz: la Estrella (esperanza), la Luna (duda), el Sol (alegría), el Juicio (despertar) y el Mundo (plenitud). Muchos Mayores en una tirada indican un asunto importante y duradero."]}, {"ic": "leaf", "t": ["Четыре масти", "Төрт түс", "The four suits", "Los cuatro palos"], "b": ["Младшие арканы делятся на 4 масти. Каждая связана со стихией и сферой жизни.\n\n🔥 Жезлы — огонь: страсть, энергия, творчество, начинания, карьера как дело жизни.\n\n💧 Кубки — вода: чувства, любовь, дружба, интуиция, отношения.\n\n⚔ Мечи — воздух: мысли, решения, конфликты, правда, общение.\n\n🌿 Пентакли — земля: деньги, работа, тело, дом, всё материальное.\n\nПодсказка: посмотри, какая масть преобладает в раскладе — она подскажет, в какой сфере сейчас главное.", "Кіші аркандар 4 түске бөлінеді. Әрқайсысы бір стихиямен және өмір саласымен байланысты.\n\n🔥 Таяқтар — от: құштарлық, қуат, шығармашылық, бастамалар, мансап.\n\n💧 Тостағандар — су: сезім, махаббат, достық, түйсік, қарым-қатынас.\n\n⚔ Қылыштар — ауа: ой, шешім, қақтығыс, ақиқат, сөйлесу.\n\n🌿 Пентакльдер — жер: ақша, жұмыс, дене, үй, барлық материалдық нәрсе.\n\nКеңес: болжауда қай түс басым екенін қара — ол қазір қай салада басты мәселе екенін көрсетеді.", "The Minor Arcana have 4 suits, each linked to an element and an area of life.\n\n🔥 Wands — fire: passion, energy, creativity, new ventures, your calling.\n\n💧 Cups — water: feelings, love, friendship, intuition, relationships.\n\n⚔ Swords — air: thoughts, decisions, conflict, truth, communication.\n\n🌿 Pentacles — earth: money, work, body, home, everything material.\n\nTip: notice which suit dominates a reading — it shows which area of life matters most right now.", "Los Arcanos Menores tienen 4 palos, cada uno ligado a un elemento y un área de la vida.\n\n🔥 Bastos — fuego: pasión, energía, creatividad, nuevos proyectos, vocación.\n\n💧 Copas — agua: sentimientos, amor, amistad, intuición, relaciones.\n\n⚔ Espadas — aire: pensamientos, decisiones, conflictos, verdad, comunicación.\n\n🌿 Oros — tierra: dinero, trabajo, cuerpo, hogar, todo lo material.\n\nConsejo: fíjate qué palo predomina en la tirada: indica qué área de tu vida importa más ahora."]}, {"ic": "spreads", "t": ["Числа и придворные карты", "Сандар мен сарай карталары", "Numbers and court cards", "Números y figuras"], "b": ["Каждое число в Младших арканах имеет свой смысл — он одинаков для всех мастей:\n\nТуз — начало, 2 — выбор и баланс, 3 — рост, 4 — стабильность, 5 — испытание, 6 — гармония, 7 — проверка и стратегия, 8 — движение, 9 — почти у цели, 10 — завершение цикла.\n\nСоедини число с мастью — и получишь смысл: Тройка Кубков = рост (3) в чувствах (Кубки), то есть радость, дружба, праздник.\n\nПридворные карты часто показывают людей или роли: Паж — ученик и новости, Рыцарь — действие и порыв, Королева — зрелая забота, Король — власть и ответственность.", "Кіші аркандардағы әр санның өз мағынасы бар — ол барлық түске бірдей:\n\nТуз — бастама, 2 — таңдау мен тепе-теңдік, 3 — өсу, 4 — тұрақтылық, 5 — сынақ, 6 — үйлесім, 7 — тексеру мен стратегия, 8 — қозғалыс, 9 — мақсатқа жақын, 10 — кезеңнің аяқталуы.\n\nСанды түспен қос — мағына шығады: Тостағандар үші = сезімдегі (Тостағандар) өсу (3), яғни қуаныш, достық, мереке.\n\nСарай карталары көбіне адамдарды немесе рөлдерді көрсетеді: Паж — шәкірт пен жаңалық, Рыцарь — әрекет пен екпін, Патшайым — кемел қамқорлық, Патша — билік пен жауапкершілік.", "Each number in the Minor Arcana has a meaning that is the same across suits:\n\nAce — beginning, 2 — choice and balance, 3 — growth, 4 — stability, 5 — challenge, 6 — harmony, 7 — testing and strategy, 8 — movement, 9 — nearly there, 10 — end of a cycle.\n\nCombine number and suit to get the meaning: Three of Cups = growth (3) in feelings (Cups) — joy, friendship, celebration.\n\nCourt cards often point to people or roles: Page — student and news, Knight — action and drive, Queen — mature care, King — authority and responsibility.", "Cada número de los Arcanos Menores tiene un significado común a todos los palos:\n\nAs — comienzo, 2 — elección y equilibrio, 3 — crecimiento, 4 — estabilidad, 5 — prueba, 6 — armonía, 7 — evaluación y estrategia, 8 — movimiento, 9 — casi al final, 10 — cierre de un ciclo.\n\nUne número y palo y tendrás el sentido: Tres de Copas = crecimiento (3) en los sentimientos (Copas): alegría, amistad, celebración.\n\nLas figuras suelen señalar personas o roles: Sota — aprendiz y noticias, Caballero — acción e impulso, Reina — cuidado maduro, Rey — autoridad y responsabilidad."]}, {"ic": "yes", "t": ["Прямые и перевёрнутые", "Тура және төңкерілген", "Upright and reversed", "Al derecho e invertidas"], "b": ["Карта может выпасть прямо или вверх ногами. Перевёрнутая карта — не «плохая». Обычно она значит, что энергия карты заблокирована, ослаблена, задерживается или направлена внутрь.\n\nНапример, Солнце прямо — радость и успех, перевёрнутое — радость есть, но её пока закрывают тучи.\n\nМногие тарологи вообще не используют перевёрнутые карты и читают только прямые значения, учитывая соседние карты. Это нормально.\n\nВ Tarota перевёрнутые карты можно отключить: Профиль → «Перевёрнутые карты».", "Карта тура немесе төңкеріліп түсуі мүмкін. Төңкерілген карта «жаман» емес. Әдетте ол картаның қуаты бөгелгенін, әлсірегенін, кешігетінін немесе ішке бағытталғанын білдіреді.\n\nМысалы, Күн тура — қуаныш пен табыс, төңкерілген — қуаныш бар, бірақ әзірге бұлт жауып тұр.\n\nКөптеген таро оқушылары төңкерілген карталарды мүлде қолданбайды. Бұл қалыпты.\n\nTarota-да төңкерілген карталарды өшіруге болады: Профиль → «Төңкерілген карталар».", "A card can land upright or upside down. A reversed card is not \"bad\". It usually means the card's energy is blocked, weakened, delayed or turned inward.\n\nFor example, the Sun upright is joy and success; reversed, the joy is there but hidden behind clouds for now.\n\nMany readers don't use reversals at all and read only upright meanings, paying attention to neighbouring cards. That's fine.\n\nIn Tarota you can switch reversals off: Profile → \"Reversed cards\".", "Una carta puede salir al derecho o invertida. Una carta invertida no es «mala». Suele indicar que su energía está bloqueada, debilitada, retrasada o dirigida hacia dentro.\n\nPor ejemplo, el Sol al derecho es alegría y éxito; invertido, la alegría existe pero de momento la tapan las nubes.\n\nMuchos lectores no usan cartas invertidas y solo leen los significados al derecho, atendiendo a las cartas vecinas. Está bien.\n\nEn Tarota puedes desactivarlas: Perfil → «Cartas invertidas»."]}, {"ic": "heart", "t": ["Как задать вопрос", "Сұрақты қалай қою керек", "How to ask a question", "Cómo hacer una pregunta"], "b": ["От вопроса зависит половина расклада. Лучшие вопросы — открытые и про тебя: «Что мне важно понять в этих отношениях?» вместо «Он меня любит?».\n\nСпрашивай о том, на что можешь повлиять: «Как мне подготовиться к собеседованию?» работает лучше, чем «Получу ли я работу?».\n\nДля быстрых решений подойдёт расклад «Да или нет», но воспринимай ответ как подсказку, а не как приказ.\n\nПеред раскладом сделай вдох, сформулируй вопрос одним предложением и не задавай один и тот же вопрос много раз подряд — первый ответ обычно самый честный.", "Болжаудың жартысы сұраққа байланысты. Ең жақсы сұрақтар — ашық және өзің туралы: «Ол мені сүйе ме?» орнына «Бұл қарым-қатынаста маған нені түсіну маңызды?».\n\nӨзің әсер ете алатын нәрсе туралы сұра: «Сұхбатқа қалай дайындалуым керек?» деген «Жұмысқа аламын ба?» дегеннен жақсы.\n\nЖылдам шешім үшін «Иә немесе жоқ» болжауы жарайды, бірақ жауапты бұйрық емес, кеңес ретінде қабылда.\n\nБолжау алдында терең тыныс ал, сұрақты бір сөйлеммен тұжырымда және бір сұрақты қатарынан көп рет қойма — алғашқы жауап әдетте ең адал.", "Half of a reading is the question. The best questions are open and about you: \"What do I need to understand about this relationship?\" instead of \"Does he love me?\".\n\nAsk about what you can influence: \"How can I prepare for the interview?\" works better than \"Will I get the job?\".\n\nFor quick decisions use the Yes or No spread, but take the answer as a hint, not an order.\n\nBefore drawing, take a breath, phrase the question in one sentence, and don't ask the same thing again and again — the first answer is usually the most honest.", "La mitad de una tirada es la pregunta. Las mejores son abiertas y sobre ti: «¿Qué necesito entender de esta relación?» en vez de «¿Me quiere?».\n\nPregunta por lo que puedes influir: «¿Cómo preparo la entrevista?» funciona mejor que «¿Me darán el trabajo?».\n\nPara decisiones rápidas usa la tirada Sí o No, pero toma la respuesta como una pista, no como una orden.\n\nAntes de sacar cartas, respira, formula la pregunta en una frase y no repitas la misma pregunta una y otra vez: la primera respuesta suele ser la más honesta."]}];

 const s=st.ob;
 if(s==0)return`<div class="grow"></div><div class="hero-arch">${HERO}</div><div class="center"><h1>${tr("ob_w_t")}</h1><p class="muted">${tr("ob_w_s")}</p></div><div style="display:flex;justify-content:center;gap:8px;margin:14px 0 18px">${LANGS.map(l=>`<button class="chip ${st.lang==l?"on":""}" style="padding:7px 12px;font-size:13px" onclick="st.lang='${l}';save();render()">${l.toUpperCase()}</button>`).join("")}</div><div class="grow"></div><button class="btn t" onclick="obNext()">${tr("start")}</button>`;
 if(s==1)return prog(1)+`<h1>${tr("ob_name_t")}</h1><p class="muted">${tr("ob_name_s")}</p><input class="f" id="nm" maxlength="30" placeholder="${tr("name_ph")}" value="${esc(st.name)}" oninput="st.name=this.value;document.getElementById('go').disabled=!this.value.trim()" autofocus><div class="grow"></div><button class="btn" id="go" ${st.name.trim()?"":"disabled"} onclick="st.name=st.name.trim();obNext()">${tr("next")}</button>`;
 if(s==2){if(!st.birth)st.birth="1998-01-01";
  return prog(2)+`<h1>${tr("ob_birth_t")}</h1><p class="muted">${tr("ob_birth_s")}</p>${wheelsHtml()}<div id="bres">${birthRes()}</div><div class="grow"></div><button class="btn" onclick="save();obNext()">${tr("next")}</button>`}
 if(s==3)return prog(3)+`<h1>${tr("ob_focus_t")}</h1><p class="muted">${tr("ob_focus_s")}</p><div class="chips">${FOCUS.map(([k,n])=>`<button class="chip ${st.focus.includes(k)?"on":""}" onclick="tg('${k}')">${T(n)}</button>`).join("")}</div><div class="grow"></div><button class="btn" ${st.focus.length?"":"disabled"} onclick="obNext()">${tr("next")}</button>`;
 if(s==4)return prog(4)+`<h1>${tr("ob_rel_t")}</h1><p class="muted">${tr("ob_rel_s")}</p>${REL.map((r,i)=>`<button class="opt ${st.rel==i?"on":""}" onclick="st.rel=${i};save();render()">${T(r)}</button>`).join("")}<div class="grow"></div><button class="btn" ${st.rel>=0?"":"disabled"} onclick="obNext()">${tr("next")}</button>`;
 if(s==5)return prog(5)+`<h1>${tr("ob_notif_t")}</h1><p class="muted">${tr("ob_notif_s")}</p>${NOTIF.map((r,i)=>`<button class="opt ${st.notif==i?"on":""}" onclick="st.notif=${i};save();render()">${T(r)}</button>`).join("")}<div class="grow"></div><button class="btn" onclick="obNext();building()">${tr("next")}</button>`;
 if(s==6)return prog(6)+`<h1>${tr("ob_build_t")} ${esc(st.name)}…</h1><div style="height:20px"></div>${["b1","b2","b3"].map((k,i)=>`<div class="check" id="ck${i}"><i>✓</i>${tr(k)}</div>`).join("")}<div class="grow"></div>${face(0,false,false,"120px")}<div class="grow"></div>`;
 return vPaywall(true)}
const YEARS=[];for(let y=new Date().getFullYear();y>=1930;y--)YEARS.push(y);
function monthNames(){return[...Array(12)].map((_,i)=>{const n=new Date(2000,i,1).toLocaleString(st.lang,{month:"long"});return n[0].toUpperCase()+n.slice(1)})}
function bparts(){const [y,m,d]=st.birth.split("-").map(Number);return{y,m,d}}
function wheelsHtml(){const{y,m,d}=bparts();
 const col=(id,items,sel)=>`<div class="wheel" id="${id}" onscroll="wheelScroll(this)">${items.map((t,i)=>`<div class="${i==sel?"sel":""}" onclick="this.parentElement.scrollTo({top:${i}*44,behavior:'smooth'})">${t}</div>`).join("")}</div>`;
 setTimeout(()=>{const p=bparts();const set=(id,i)=>{const e=document.getElementById(id);if(e)e.scrollTop=i*44};set("wd",p.d-1);set("wm",p.m-1);set("wy",YEARS.indexOf(p.y))},0);
 return`<div class="wheels">${col("wd",[...Array(31)].map((_,i)=>i+1),d-1)}<div style="flex:1.7;display:flex">${col("wm",monthNames(),m-1)}</div>${col("wy",YEARS,YEARS.indexOf(y))}</div>`}
let wt=null;function wheelScroll(el){const i=Math.round(el.scrollTop/44);[...el.children].forEach((c,k)=>c.classList.toggle("sel",k==i));clearTimeout(wt);wt=setTimeout(()=>{
 const g=id=>Math.round(document.getElementById(id).scrollTop/44);let d=g("wd")+1,m=g("wm")+1,y=YEARS[g("wy")]||1998;const last=new Date(y,m,0).getDate();
 if(d>last){d=last;document.getElementById("wd").scrollTo({top:(d-1)*44,behavior:"smooth"})}
 st.birth=`${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;save();const r=document.getElementById("bres");if(r)r.innerHTML=birthRes()},140)}
function birthRes(){const d=new Date(st.birth+"T12:00");const z=zodiac(d),b=birthCard(st.birth);return`<div class="daily" style="margin-top:18px;cursor:default">${face(b,false,true,"74px")}<div><div class="pos">${tr("your_sign")}</div><div class="cname">${T(ZOD[z])}</div><div class="pos" style="margin-top:8px">${tr("birth_card")}</div><div class="cname">${D.MAJOR_NAMES[L()][b]}</div></div></div>`}
function applyTheme(){const dark=st.theme==2||(st.theme==0&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.th=dark?"dark":"light"}
/* ---------- learning ---------- */
function vLearn(){return`<h1>${tr("tab_learn")}</h1><h2>${tr("practice")}</h2>
 <div class="ask" style="background:var(--terra);display:flex;gap:12px;align-items:center;cursor:pointer" onclick="ui.quiz=newQuiz(0,0);render()"><div style="flex:1"><div class="disp" style="font-size:18px;color:#fff">${tr("quiz_t")}</div><div class="small" style="color:#fffd;margin-top:6px">${tr("quiz_s")}</div></div>${face(17,false,false,"56px")}</div>
 <h2>${tr("lessons")}</h2>${LESSONS.map((l,i)=>`<div class="daily" style="margin-bottom:10px" onclick="ui.lesson=${i};render()"><span style="width:44px;height:44px;border-radius:22px;background:var(--paper2);display:flex;align-items:center;justify-content:center;color:var(--terra);flex:none">${svg(l.ic=="cards"?"cards":l.ic,"currentColor",1.8).replace("<svg ",'<svg width="22" height="22" ')}</span><div style="flex:1"><div class="muted tiny">${tr("lesson")} ${i+1}</div><b>${T(l.t)}</b></div><span style="color:var(--terra)">→</span></div>`).join("")}
 <h2>${tr("all_cards")}</h2><div style="display:flex;gap:10px;cursor:pointer" onclick="ui.all=true;render()">${[0,19,23,36].map(i=>`<div style="flex:1">${face(i,false,true,"100%")}</div>`).join("")}</div><div style="height:12px"></div><button class="obtn" onclick="ui.all=true;render()">${tr("all_cards")} →</button>`}
function vLesson(){const i=ui.lesson,l=LESSONS[i];return back()+`<div class="muted small">${tr("lesson")} ${i+1} / ${LESSONS.length}</div><h1 style="margin-top:4px">${T(l.t)}</h1><div class="lesson">${T(l.b).split("\n\n").map(p=>`<p>${esc(p)}</p>`).join("")}</div><div style="height:24px"></div>${i+1<LESSONS.length?`<button class="btn" onclick="ui.lesson=${i+1};render();document.getElementById('m').scrollTop=0">${tr("lesson")} ${i+2}: ${T(LESSONS[i+1].t)} →</button>`:`<button class="obtn" onclick="goBack()">${tr("back")}</button>`}`}
function newQuiz(score,total){const c=Math.floor(Math.random()*78);const others=[...Array(78).keys()].filter(x=>x!=c&&mean(x,false)!=mean(c,false)).sort(()=>Math.random()-.5).slice(0,2);return{c,opts:[...others,c].sort(()=>Math.random()-.5),picked:null,score,total}}
function vQuiz(){const q=ui.quiz;return`<div style="display:flex;align-items:center"><div style="flex:1">${back()}</div><span class="badge">${tr("score")}: ${q.score} / ${q.total}</span></div><h1 style="font-size:20px;margin:10px 0">${tr("quiz_q")}</h1><div style="display:flex;justify-content:center">${face(q.c,false,true,"150px")}</div><div class="cname center" style="margin:12px 0">${cname(q.c)}</div>
 ${q.opts.map(o=>`<button class="qopt ${q.picked==null?"":o==q.c?"ok":o==q.picked?"bad":""}" ${q.picked==null?`onclick="pickQ(${o})"`:""}>${mean(o,false)}</button>`).join("")}
 ${q.picked==null?"":`<div class="disp" style="font-size:20px;margin:8px 0;color:${q.picked==q.c?"var(--sage)":"var(--terra)"}">${tr(q.picked==q.c?"correct":"wrong")}</div><button class="btn" onclick="ui.quiz=newQuiz(ui.quiz.score,ui.quiz.total);render()">${tr("next_card")}</button>`}`}
function pickQ(o){const q=ui.quiz;q.picked=o;q.total++;if(o==q.c)q.score++;render()}
function tg(k){st.focus=st.focus.includes(k)?st.focus.filter(x=>x!=k):[...st.focus,k];save();render()}
function building(){[0,1,2].forEach(i=>setTimeout(()=>{const e=document.getElementById("ck"+i);e&&e.classList.add("on")},500+i*700));setTimeout(()=>{st.ob=7;save();render()},2900)}
function vPaywall(fromOb){
 const close=fromOb?"finishOb()":"ui.pay=false;render()";
 return`<button class="x" onclick="${close}">×</button><div class="hero-arch" style="width:150px;height:200px;margin:18px auto 18px">${HERO}</div><h1 class="center">${tr("pw_t")}</h1>${["pw1","pw2","pw3","pw4"].map(k=>`<div class="ben"><i>✓</i>${tr(k)}</div>`).join("")}<div style="height:12px"></div>
 <div class="plan ${st.plan==0?"on":""}" onclick="st.plan=0;render()"><div><b>${tr("month")}</b><div class="muted small">${tr("month_p")}</div></div></div>
 <div class="plan ${st.plan==1?"on":""}" onclick="st.plan=1;render()"><div><b>${tr("q3")}</b><div class="muted small">${tr("q3_p")}</div></div><span class="tag">${tr("best_q3")}</span></div>
 <div class="plan ${st.plan==2?"on":""}" onclick="st.plan=2;render()"><div><b>${tr("year")}</b><div class="muted small">${tr("year_p")}</div></div></div>
 <button class="btn t" onclick="st.premium=true;${close}">${st.plan==1?tr("pw_cta"):tr("pw_cta2")}</button><p class="muted tiny center">${tr("pw_note")}</p><div class="center"><button class="link tiny" style="color:var(--muted)">${tr("pw_restore")}</button> · <a class="link tiny" style="color:var(--muted)" target="_blank" href="https://tarota.forwardip.online/terms.html">${tr("terms")}</a></div>`}
function finishOb(){st.ob=99;save();render()}

/* ---------- main screens ---------- */
function greet(){const h=new Date().getHours();return tr(h<12?"hi_m":h<18?"hi_d":"hi_e")}
function vHome(){
 if(!st.daily||st.daily.date!=today()){st.daily={date:today()};st.dailyOpen=false;save()}
 {const r=seeded((st.name||"").trim().toLowerCase()+"|"+st.birth+"|"+today());st.daily.c=Math.floor(r()*78);st.daily.r=st.rev&&r()<.3}
 const d=st.daily,z=st.birth?T(ZOD[zodiac(new Date(st.birth+"T12:00"))]):"";
 const order=[...SP].sort((a,b)=>(st.focus.includes("love")&&b.id=="love")-(st.focus.includes("love")&&a.id=="love"));
 return`<div style="display:flex;align-items:center;justify-content:space-between"><div><div class="muted small">${greet()},</div><h1 style="margin:0">${esc(st.name||"")}</h1></div><div class="badge">🔥 ${streak()} ${tr("streak")}</div></div>
 ${z?`<div class="badge" style="margin-top:10px">${z} · ${D.MAJOR_NAMES[L()][birthCard(st.birth)]}</div>`:""}
 <div class="ask" style="margin-top:18px"><div class="disp" style="font-size:18px">${tr("ask_t")}</div><textarea id="q" rows="2" maxlength="300" placeholder="${tr("ask_ph")}">${esc(ui.q)}</textarea><button class="btn t" onclick="askNow()">${tr("ask_btn")}</button></div>
 <h2>${tr("card_of_day")}</h2>
 <div class="daily" onclick="${st.dailyOpen?`ui.card=${d.c};render()`:"openDaily()"}">${face(d.c,d.r,st.dailyOpen,"86px")}<div>${st.dailyOpen?`<div class="cname">${cname(d.c)}</div>${d.r?`<div class="muted small">${tr("reversed")}</div>`:""}<div class="small" style="margin-top:6px">${mean(d.c,d.r)}</div>`:`<div class="cname">${tr("daily_open")}</div><div class="muted small" style="margin-top:6px">${tr("daily_hint")}</div>`}</div></div>
 <h2>${tr("quick")}</h2><div class="tiles">${order.map(s=>tileHtml(s)).join("")}</div>`+disc()}
function tileHtml(s){const i=SP.indexOf(s);return`<button class="tile ${s.c}" onclick="openSpread(${i})"><span class="ic">${svg(s.ic,"currentColor",1.6)}</span><div><b>${T(s.n)}</b><div class="tiny" style="opacity:.7;margin-top:4px">${s.p[0].length} ${tr("cards_count")}${s.pro&&!st.premium?" · ★ "+tr("locked"):""}</div></div></button>`}
function openSpread(i){if(SP[i].pro&&!st.premium){ui.pay=true;render();return}ui.spread=i;ui.cur=null;render()}
function openDaily(){st.dailyOpen=true;markDay();save();render()}
function askNow(){const q=document.getElementById("q").value.trim();ui.q="";ui.spread=2;doDraw(q)}
function vSpreads(){return`<h1>${tr("all_spreads")}</h1><div class="tiles" style="margin-top:14px">${SP.map(s=>tileHtml(s)).join("")}</div>`}
function body(r,hidden){
 const s=SP.find(x=>x.id==r.s);if(!r.open)r.open=r.cards.map(()=>!hidden);
 let h=r.q?`<p style="font-weight:600">“${esc(r.q)}”</p>`:"";
 if(s.id=="yesno"&&r.open.every(Boolean)){const d=r.cards[0];let p=pol(d.c);if(d.r)p=-p;h+=`<div class="answer">${tr(p>0?"yes":p<0?"no":"maybe")}</div>`}
 r.cards.forEach((d,i)=>{h+=`<div class="row">${face(d.c,d.r,r.open[i],"92px",`reveal(${i})`)}${r.open[i]?meaningBlock(d,s.p[L()][i]):`<div style="flex:1"><div class="pos">${s.p[L()][i]}</div><div class="muted" style="margin-top:6px">${tr("tap_reveal")}</div></div>`}</div>`});
 return h}
function reveal(i){(ui.reading||ui.cur).open[i]=true;render()}
function vSpread(){
 const s=SP[ui.spread];let h=back()+`<h1>${T(s.n)}</h1>`;
 if(!ui.cur)h+=`<textarea id="q2" rows="3" maxlength="300" placeholder="${tr("question_hint")}"></textarea><div style="height:16px"></div><button class="btn" onclick="doDraw(document.getElementById('q2').value.trim())">${tr("draw")}</button>`;
 else h+=body(ui.cur,true)+`<p class="muted small">${tr("saved")}</p><button class="obtn" onclick="ui.cur=null;render()">${tr("again")}</button>`;
 return h+disc()}
function doDraw(q){const s=SP[ui.spread];const r={t:Date.now(),s:s.id,q,cards:draw(s.p[0].length)};st.journal.unshift({t:r.t,s:r.s,q:r.q,cards:r.cards});markDay();save();ui.cur=r;render();document.getElementById("m").scrollTop=0}
function vCards(){return back()+`<h1>${tr("all_cards")}</h1><div class="grid" style="margin-top:12px">`+[...Array(78).keys()].map(i=>face(i,false,true,"100%",`ui.card=${i};render()`)).join("")+`</div>`}
function vCard(){const id=ui.card;return back()+`<div style="display:flex;justify-content:center;margin:8px 0 18px">${face(id,false,true,"180px")}</div><div class="cname" style="font-size:22px">${cname(id)}</div><div class="muted small">${tr(major(id)?"major":"minor")}</div><div class="pos" style="margin-top:18px">${tr("upright")}</div><div>${mean(id,false)}</div><div class="pos" style="margin-top:14px">${tr("reversed")}</div><div>${mean(id,true)}</div>`}
function vJournal(){
 if(!st.journal.length)return`<h1>${tr("tab_journal")}</h1><p class="muted">${tr("journal_empty")}</p>`;
 return`<h1>${tr("tab_journal")}</h1>`+st.journal.map((r,i)=>{const s=SP.find(x=>x.id==r.s);return`<div class="daily" style="display:block;margin-bottom:10px" onclick="ui.reading={...st.journal[${i}],open:null};render()"><div style="display:flex;align-items:center"><span class="pos" style="flex:1">${T(s.n)}</span><button class="link tiny" style="color:var(--muted);padding:0" onclick="event.stopPropagation();st.journal.splice(${i},1);save();render()">${tr("delete")}</button></div><div class="muted tiny">${fmt(r.t)}</div>${r.q?`<div style="font-weight:600;margin-top:4px">“${esc(r.q)}”</div>`:""}<div class="muted small" style="margin-top:4px">${r.cards.map(d=>cname(d.c)).join(" · ")}</div></div>`}).join("")}
function vReading(){const r=ui.reading;return back()+`<h1>${T(SP.find(x=>x.id==r.s).n)}</h1><div class="muted small">${fmt(r.t)}</div>`+body(r,false)}
function vProfile(){
 return`<h1>${tr("profile")}</h1><div class="daily" style="cursor:default">${st.birth?face(birthCard(st.birth),false,true,"64px"):""}<div><div class="cname">${esc(st.name)}</div>${st.birth?`<div class="muted small">${T(ZOD[zodiac(new Date(st.birth+"T12:00"))])} · ${D.MAJOR_NAMES[L()][birthCard(st.birth)]}</div>`:""}<div class="badge" style="margin-top:8px">${st.premium?"★ Premium":"Free"}</div></div></div>
 ${st.premium?"":`<button class="btn t" style="margin-top:14px" onclick="ui.pay=true;render()">${tr("premium")}</button>`}
 <h2>${tr("theme")}</h2><div class="chips">${["theme_sys","theme_light","theme_dark"].map((k,i)=>`<button class="chip ${st.theme==i?"on":""}" style="padding:7px 12px;font-size:13px" onclick="st.theme=${i};save();render()">${tr(k)}</button>`).join("")}</div><h2>${tr("language")}</h2>`+LANGS.map(l=>`<label class="r"><input type="radio" name="l" ${st.lang==l?"checked":""} onchange="st.lang='${l}';save();render()"> ${LN[l]}</label>`).join("")+
 `<hr><label class="r" style="justify-content:space-between"><span>${tr("use_reversed")}<div class="muted tiny" style="font-weight:400">${tr("use_reversed_hint")}</div></span><input type="checkbox" ${st.rev?"checked":""} onchange="st.rev=this.checked;save()"></label><hr>`+
 [["privacy","privacy.html"],["terms","terms.html"],["support","support.html"]].map(([k,p])=>`<div><a class="link" target="_blank" href="https://tarota.forwardip.online/${p}?lang=${st.lang}">${tr(k)}</a></div>`).join("")+
 `<button class="link" style="color:var(--muted)" onclick="st.journal=[];save();render()">${tr("clear_journal")}</button><br><button class="link" style="color:var(--muted)" onclick="st.ob=0;st.premium=false;save();render()">${tr("redo")}</button>`+disc()+`<div class="muted tiny">Tarota 1.0.0</div>`}
const TABS=[["home","home","tab_home"],["spreads","spreads","tab_spreads"],["learn","cards","tab_learn"],["journal","journal","tab_journal"],["profile","profile","profile"]];
function render(){
 document.documentElement.lang=st.lang;applyTheme();
 const m=document.getElementById("m"),n=document.getElementById("n");
 if(st.ob<99){m.className="ob";n.style.display="none";m.innerHTML=vOb();return}
 m.className="";
 if(ui.pay){n.style.display="none";m.innerHTML=vPaywall(false);return}
 n.style.display="flex";
 m.innerHTML=ui.card!=null?vCard():ui.lesson!=null?vLesson():ui.quiz?vQuiz():ui.all?vCards():ui.reading?vReading():ui.spread!=null?vSpread():{home:vHome,spreads:vSpreads,learn:vLearn,journal:vJournal,profile:vProfile}[st.tab]();
 n.innerHTML=TABS.map(([k,ic,t])=>`<button class="${st.tab==k?"on":""}" onclick="st.tab='${k}';ui={spread:null,card:null,reading:null,cur:null,q:'',lesson:null,quiz:null,all:false};render();document.getElementById('m').scrollTop=0">${svg(ic)}${tr(t)}</button>`).join("");
}
if(st.tab=="cards")st.tab="learn";
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",()=>render());
if(st.ob==6)building();
render();
</script></body></html>
